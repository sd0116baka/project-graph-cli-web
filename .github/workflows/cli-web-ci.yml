name: CLI and Web

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "codex/**"
  workflow_dispatch:

jobs:
  cli-web:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build headless graph packages
        run: pnpm nx build @graphif/project-graph-core

      - name: Test PRG codec
        run: pnpm --filter @graphif/prg-codec test

      - name: Test graph core
        run: pnpm --filter @graphif/project-graph-core test

      - name: Test CLI
        run: pnpm --filter @graphif/project-graph-cli test

      - name: Type-check CLI
        run: pnpm --filter @graphif/project-graph-cli type-check

      - name: Test Web server API
        run: pnpm --filter @graphif/project-graph-web-server test

      - name: Build CLI
        run: pnpm nx build @graphif/project-graph-cli

      - name: Build Web frontend
        run: pnpm run web:build

      - name: Start Web server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $DataDir = Join-Path $env:RUNNER_TEMP "project-graph-web-data"
          $LogPath = Join-Path $env:RUNNER_TEMP "project-graph-web.log"
          $StartScript = Join-Path $PWD "scripts\start-web.ps1"
          $Arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$StartScript`" -SkipBuild -NoAuth -Port 37820 -DataDir `"$DataDir`" -LogPath `"$LogPath`""
          $Process = Start-Process -FilePath "powershell.exe" -ArgumentList $Arguments -WorkingDirectory $PWD -WindowStyle Hidden -PassThru
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "project-graph-web.pid") -Value $Process.Id -Encoding UTF8

          for ($Attempt = 0; $Attempt -lt 40; $Attempt++) {
            Start-Sleep -Milliseconds 500
            try {
              $Health = Invoke-RestMethod -Uri "http://127.0.0.1:37820/api/health" -TimeoutSec 2
              if ($Health.ok) {
                exit 0
              }
            } catch {
              if ($Process.HasExited) {
                break
              }
            }
          }

          if (Test-Path $LogPath) {
            Get-Content -LiteralPath $LogPath
          }
          throw "Project Graph Web did not become healthy."

      - name: Smoke Web server
        shell: powershell
        run: |
          $DataDir = Join-Path $env:RUNNER_TEMP "project-graph-web-data"
          .\scripts\smoke-web.ps1 -Port 37820 -DataDir $DataDir

      - name: Smoke LAN auth Web server
        shell: powershell
        run: |
          $DataDir = Join-Path $env:RUNNER_TEMP "project-graph-lan-auth-data"
          .\scripts\smoke-lan-auth.ps1 -Port 37821 -DataDir $DataDir

      - name: Smoke upgrade rollback
        shell: powershell
        run: |
          $DataDir = Join-Path $env:RUNNER_TEMP "project-graph-rollback-data"
          $BackupDir = Join-Path $env:RUNNER_TEMP "project-graph-rollback-backups"
          .\scripts\smoke-upgrade-rollback.ps1 -Port 37822 -DataDir $DataDir -BackupDir $BackupDir

      - name: Package portable preview
        shell: powershell
        run: .\scripts\package-portable.ps1 -SkipBuild

      - name: Smoke portable wrapper gates
        shell: powershell
        run: |
          $ExtractRoot = Join-Path $env:RUNNER_TEMP "project graph portable smoke"
          New-Item -ItemType Directory -Force -Path $ExtractRoot | Out-Null
          $Zip = Get-ChildItem -LiteralPath "dist\portable" -Filter "project-graph-cli-web-*-windows-preview.zip" | Select-Object -First 1
          if (-not $Zip) {
            throw "Portable preview zip was not created."
          }
          Expand-Archive -LiteralPath $Zip.FullName -DestinationPath $ExtractRoot -Force
          $Runtime = Get-ChildItem -LiteralPath $ExtractRoot -Directory |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "start-web.cmd") } |
            Select-Object -First 1
          if (-not $Runtime) {
            throw "Could not locate extracted portable runtime."
          }
          Push-Location $Runtime.FullName
          try {
            .\smoke-lan-auth.cmd -Port 37823
            .\smoke-upgrade-rollback.cmd -Port 37824
          } finally {
            .\stop-web.cmd -PortStart 37823 -PortEnd 37824
            Pop-Location
          }

      - name: Check release readiness
        shell: powershell
        run: .\scripts\check-release-readiness.ps1

      - name: Upload portable preview
        uses: actions/upload-artifact@v4
        with:
          name: project-graph-cli-web-windows-preview
          path: dist/portable/*.zip
          if-no-files-found: error

      - name: Stop Web server
        if: always()
        shell: powershell
        run: |
          .\scripts\stop-web.ps1 -PortStart 37820 -PortEnd 37820
          $PidPath = Join-Path $env:RUNNER_TEMP "project-graph-web.pid"
          if (Test-Path $PidPath) {
            $ServerPid = [int](Get-Content -LiteralPath $PidPath)
            Stop-Process -Id $ServerPid -Force -ErrorAction SilentlyContinue
          }
